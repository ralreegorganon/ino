services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - ${DB_PORT_MIGRATION}:5432
    expose:
      - 5432
    volumes:
      - ino-db-data:/var/lib/postgresql/data
  ino:
    restart: always
    build: .
    environment:
      - INO_CONNECTION_STRING=${INO_CONNECTION_STRING}
    command: ino
    depends_on:
      - db
    ports:
      - 8001:8989
    expose:
      - 8989

volumes:
  ino-db-data:
